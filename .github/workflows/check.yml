name: host-and-arm64-validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang lld python3
      - name: Offline host and ARM64 checks
        run: make check cross-check
      - name: Pinned upstream parsers and EFI loader build
        run: make upstream-check
