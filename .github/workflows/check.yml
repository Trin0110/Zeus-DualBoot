name: host-and-arm64-validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-diagnostics:
    name: diagnostics (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download official Android Platform Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'platform-tools.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'Official Android Tools'
          Invoke-WebRequest 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $adb = Join-Path $tools 'platform-tools\adb.exe'
          "ZEUS_TEST_ADB=$adb" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $adb version
          if ($LASTEXITCODE -ne 0) { throw 'Official adb.exe failed' }
      - name: Native subprocess, privacy and report regression tests
        run: python -m unittest discover -s tests -v
      - name: Collector CLI smoke test (no phone access)
        run: python tools/adb-diagnostics/collect.py --help
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang lld python3
      - name: Offline host and ARM64 checks
        run: make check cross-check
      - name: Pinned upstream parsers and EFI loader build
        run: make upstream-check
